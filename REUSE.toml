version = 1

# Repository documentation is covered without adding headers to prose.
[[annotations]]
path = [
  "README.md", "AGENTS.md", "SECURITY.md", "NOTICE", "THIRD_PARTY_NOTICES.md",
  ".github/PULL_REQUEST_TEMPLATE.md",
]
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["skills/*/*.md", "skills/*/evals/*.md", "skills/*/evals/*.json", "skills/*/skill.oms.sig"]
# Embedded notices, sidecars, and nearer annotations take priority over these defaults.
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "CONTRIBUTING.md"
SPDX-FileCopyrightText = [
  "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.",
  "Copyright (C) 2004, 2006 The Linux Foundation and its contributors.",
]
# The embedded DCO retains its verbatim-copy terms; the surrounding guidance is CC-BY-4.0.
SPDX-License-Identifier = "CC-BY-4.0 AND LicenseRef-DCO-1.1"

[[annotations]]
path = "LICENSE"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "CC-BY-4.0 AND Apache-2.0"

[[annotations]]
path = [".github/license-checksums.sha256", ".github/CODEOWNERS"]
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"
