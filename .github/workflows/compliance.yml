name: Compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Check NVIDIA code headers
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0
        with:
          token: ""
      - name: Check license texts
        run: sha256sum --check .github/license-checksums.sha256
      - name: Check file attribution and full license coverage
        run: uv run --no-project --python 3.12 --with reuse==6.2.0 reuse lint
      - name: Test compliance checks
        run: uv run --no-project --python 3.12 --with reuse==6.2.0 python -m unittest discover -s tests
      - name: Check all contributed commit sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project --python 3.12 python scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
