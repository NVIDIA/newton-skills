# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true
reviews:
  auto_review:
    enabled: true
  path_instructions:
    - path: "skills/**"
      instructions: |
        Apply the README Skill Policy. Flag durable product knowledge that belongs
        in Newton documentation, unsupported APIs or versions, checkout-only
        assumptions, private runtime tools, and overlapping or overly broad triggers.
        Check evaluation outcomes, realistic positive/negative cases, and measured
        quality/efficiency claims. Distinguish routing tests from simulation validation.
        Review generated benchmarks and cards for unsupported claims; request
        regeneration rather than manual edits to signed artifacts.
    - path: "**"
      instructions: |
        Apply CONTRIBUTING.md and AGENTS.md. Check actual third-party attribution,
        license preservation, and scoped REUSE defaults that preserve explicit
        third-party metadata. Do not request headers
        on documentation or textual eval data. AI review does not establish IP
        clearance or replace a maintainer's final review.
